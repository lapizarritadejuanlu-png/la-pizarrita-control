<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0b">
<title>La Pizarrita Control</title>
<style>
:root{--bg:#0b0c0b;--panel:#171816;--panel2:#11120f;--text:#f5f2eb;--muted:#9c9992;--line:#34352f;--accent:#f7a51a;--mint:#a9e0c8;--good:#55c97c;--bad:#ef6d66}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select{font:inherit}.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:88px}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:26px 30px 24px;background:#0b0c0bf2;border-bottom:1px solid #2e302b}.eyebrow{font-size:.72rem;letter-spacing:.16em;font-weight:900;color:#f1a05a}.brand{font-family:Georgia,"Times New Roman",serif;font-size:1.7rem;font-weight:800;line-height:1.02;margin-top:3px}.cloud-btn{border:1px solid #35644f;background:transparent;color:var(--mint);border-radius:999px;padding:11px 16px;font-size:1rem}.cloud-btn:active{transform:scale(.98)}main{padding:24px 30px 34px}h2{font-size:1.8rem;margin:5px 0 26px}.card{background:linear-gradient(145deg,#191a17,#121310);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px}.dashboard-card{padding:24px 28px}.dash-label{color:#a8a49d;text-transform:uppercase;font-size:.78rem;letter-spacing:.03em}.big-result{font-size:2.55rem;font-weight:900;color:var(--good);line-height:1.1;margin:4px 0 6px}.month-select{width:auto;min-width:170px;background:#fff;color:#111;border:1px solid #bbb;border-radius:2px;padding:5px 10px;font-size:1.05rem}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px 32px;margin-top:5px}.metric span{display:block;color:#aaa69f;font-size:.96rem}.metric strong{font-size:1.22rem}.section-title{font-size:1.72rem;font-weight:850;margin:30px 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;color:#99968f;font-size:.9rem;margin-bottom:7px}input,select{width:100%;background:#0c0d0b;color:var(--text);border:1px solid #34362f;border-radius:14px;padding:14px 15px;min-height:52px;outline:none}input:focus,select:focus{border-color:#77683f}.file-wrap{grid-column:1/-1}.file-box{display:flex;align-items:center;gap:10px;border:1px solid #34362f;border-radius:14px;padding:8px 10px;background:#0c0d0b;min-height:54px;overflow:hidden}.file-box input{border:0;padding:0;min-height:auto;background:transparent}.primary{border:0;border-radius:14px;background:var(--accent);color:#1f1709;font-weight:900;padding:13px 18px;font-size:1rem}.secondary{border:1px solid #383a34;border-radius:14px;background:#181916;color:var(--text);font-weight:800;padding:13px 18px}.wide{width:100%;margin-top:14px}.ai-btn{width:100%;margin-top:14px;border:1px solid #3a3c35;border-radius:14px;background:#1a1b18;color:#f4f0e7;padding:14px;font-weight:900;font-size:1.03rem}.hint{color:#9f9b94;font-size:.88rem;line-height:1.35;margin:9px 0 0}.empty{color:#9f9b94;margin-top:10px}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;justify-content:space-between;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:#151613}.row-title{font-weight:800}.row-meta{font-size:.82rem;color:var(--muted);margin-top:4px}.row-amount{font-weight:900;white-space:nowrap}.invoice-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.invoice-actions button{padding:7px 10px;font-size:.76rem}.danger{border-color:#633733;color:#ffaaa4}.edit-note{color:#d9b86e;font-size:.84rem;margin:0 0 14px}.invoice-tools{padding:16px}.invoice-tools-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:10px}.invoice-summary{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}.invoice-summary strong{font-size:1.05rem;color:var(--text)}.account-title{font-size:1.2rem;margin:0 0 16px}.account-email{color:#9f9b94;margin:0 0 18px;word-break:break-all}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#0d0e0c;border-top:1px solid #30322c;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}.nav{border:0;background:transparent;color:#aaa69e;font-weight:800;padding:8px 2px;font-size:.82rem}.nav.active{color:var(--accent)}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:#171816;border:1px solid #36372f;border-radius:22px;padding:28px}.login-card h1{font-family:Georgia,"Times New Roman",serif;margin:0 0 6px}.login-card p{color:var(--muted);margin:0 0 22px}.login-card .field{margin-bottom:14px}.login-actions{display:flex;gap:10px;flex-wrap:wrap}.status{font-size:.85rem;margin-top:12px;color:#d8b76b}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;background:#20221e;color:#fff;border:1px solid #44463e;border-radius:999px;padding:10px 16px;box-shadow:0 8px 28px #0008;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.loading{opacity:.65;pointer-events:none}.small-note{color:#9e9a92;font-size:.82rem;margin-top:8px}.sync-pill{display:inline-flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
@media(max-width:540px){.topbar{padding:26px 30px 22px}.brand{font-size:1.62rem}main{padding:26px 30px 30px}.form-grid{gap:12px 16px}.metrics{gap:18px 24px}.cloud-btn{font-size:.95rem;padding:10px 14px}}
@media(max-width:390px){.topbar,main{padding-left:22px;padding-right:22px}.brand{font-size:1.45rem}.eyebrow{font-size:.66rem}.form-grid{grid-template-columns:1fr}.field.full,.file-wrap{grid-column:auto}.metrics{gap:16px}.nav{font-size:.76rem}.invoice-tools-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast"></div>
<script>
const SB_URL='https://mpzemodwiuxqemvfaqvs.supabase.co';
const SB_KEY='sb_publishable_5b0LE9t_UFaHQwsYZ7BvKQ_k_tAmbVc';
const PROJECT_REF='mpzemodwiuxqemvfaqvs';
const SESSION_KEY='pizarrita-cloud-session-v3';
let session=null,route='dashboard',selectedMonth=localDate().slice(0,7),invoices=[],products=[],moves=[],busy=false,editingInvoiceId=null,editingFilePath=null,invoiceFilterText='',invoiceFilterMonth='all';

function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function euro(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0)}
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function monthLabel(m){return new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(new Date(m+'-02T12:00:00'))}
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
function setBusy(v){busy=v;document.querySelector('.app')?.classList.toggle('loading',v)}

async function api(path,{method='GET',body,headers={}}={}){
  const h={apikey:SB_KEY,...headers};
  if(session?.access_token)h.Authorization=`Bearer ${session.access_token}`;
  if(body!==undefined&&!(body instanceof Blob)&&!(body instanceof File)&&!h['Content-Type'])h['Content-Type']='application/json';
  const res=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:(h['Content-Type']==='application/json'?JSON.stringify(body):body)});
  if(res.status===401&&session?.refresh_token&&!path.startsWith('/auth/v1/token')){const ok=await refreshSession();if(ok)return api(path,{method,body,headers})}
  const text=await res.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}
  if(!res.ok){const msg=data?.msg||data?.message||data?.error_description||data?.error||`Error ${res.status}`;throw new Error(msg)}
  return data;
}
function saveSession(s){session=s;localStorage.setItem(SESSION_KEY,JSON.stringify(s))}
function candidateSessions(){const out=[];const keys=[SESSION_KEY,`sb-${PROJECT_REF}-auth-token`,'pizarrita-supabase-session','pizarrita-cloud-session','pizarrita-auth'];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&!keys.includes(k)&&(k.includes(PROJECT_REF)||k.toLowerCase().includes('supabase')||k.toLowerCase().includes('pizarrita')))keys.push(k)}for(const k of keys){try{const val=JSON.parse(localStorage.getItem(k)||'null');if(!val)continue;const opts=[val,val.currentSession,val.session,val.data?.session,val.data];for(const x of opts){if(x?.access_token&&x?.refresh_token)out.push(x)}}catch{}}return out}
async function validateSession(s){try{session=s;const u=await api('/auth/v1/user');session={...s,user:u};saveSession(session);return true}catch{return false}}
async function refreshSession(){if(!session?.refresh_token)return false;try{const res=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!res.ok)return false;const s=await res.json();saveSession(s);return true}catch{return false}}
async function restoreSession(){for(const s of candidateSessions()){if(await validateSession(s))return true;session=s;if(await refreshSession()&&await validateSession(session))return true}session=null;return false}
async function signIn(email,password){const res=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await res.json();if(!res.ok)throw new Error(data.error_description||data.msg||'No se ha podido entrar');saveSession(data);return true}
async function signUp(email,password){const res=await fetch(`${SB_URL}/auth/v1/signup`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const data=await res.json();if(!res.ok)throw new Error(data.error_description||data.msg||'No se ha podido crear el acceso');if(data.access_token)saveSession(data);return data}
async function signOut(){try{await api('/auth/v1/logout',{method:'POST'})}catch{}session=null;for(const k of Object.keys(localStorage)){if(k===SESSION_KEY||k===`sb-${PROJECT_REF}-auth-token`||k.includes(PROJECT_REF)||k.toLowerCase().includes('pizarrita'))localStorage.removeItem(k)}renderLogin()}

async function loadData(){try{setBusy(true);const [i,p,m]=await Promise.all([api('/rest/v1/invoices?select=*&order=invoice_date.desc'),api('/rest/v1/products?select=*&order=price_date.desc'),api('/rest/v1/moves?select=*&order=move_date.desc')]);invoices=i||[];products=p||[];moves=m||[];renderApp()}catch(e){toast('Error al sincronizar: '+e.message)}finally{setBusy(false)}}
function monthRows(rows,key){return rows.filter(x=>(x[key]||'').slice(0,7)===selectedMonth)}
function invoiceRow(x,actions=false){const buttons=`<div class="invoice-actions">${x.file_path?`<button type="button" class="secondary invoice-file" data-file-path="${esc(x.file_path)}">📎 Ver archivo</button>`:''}${actions?`<button type="button" class="secondary invoice-edit" data-invoice-id="${esc(x.id)}">✏️ Editar</button><button type="button" class="secondary danger invoice-delete" data-invoice-id="${esc(x.id)}">🗑 Borrar</button>`:''}</div>`;const search=`${x.supplier||''} ${x.invoice_number||''}`.toLowerCase();return `<div class="row invoice-row" data-search="${esc(search)}" data-month="${esc((x.invoice_date||'').slice(0,7))}" data-total="${Number(x.total)||0}"><div><div class="row-title">${esc(x.supplier)}</div><div class="row-meta">${fmtDate(x.invoice_date)} · ${esc(x.invoice_number||'Sin nº')}</div>${buttons}</div><div class="row-amount">${euro(x.total)}</div></div>`}
function dashboard(){const inv=monthRows(invoices,'invoice_date'),mv=monthRows(moves,'move_date');const sales=mv.filter(x=>x.move_type==='ingreso').reduce((a,x)=>a+Number(x.amount||0),0);const purchases=inv.reduce((a,x)=>a+Number(x.total||0),0);const personal=mv.filter(x=>x.move_type==='personal').reduce((a,x)=>a+Number(x.amount||0),0);const other=mv.filter(x=>x.move_type==='gasto').reduce((a,x)=>a+Number(x.amount||0),0);const result=sales-purchases-personal-other;const monthOptions=(()=>{const set=new Set([localDate().slice(0,7),selectedMonth]);for(const x of invoices)if(x.invoice_date)set.add(x.invoice_date.slice(0,7));for(const x of products)if(x.price_date)set.add(x.price_date.slice(0,7));for(const x of moves)if(x.move_date)set.add(x.move_date.slice(0,7));const d=new Date();for(let i=0;i<18;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,2);set.add(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`)}return [...set].sort().reverse()})();const monthOptionsHtml=monthOptions.map(m=>`<option value="${esc(m)}" ${m===selectedMonth?'selected':''}>${esc(monthLabel(m))}</option>`).join('');const recent=invoices.slice(0,5);return `<div class="card dashboard-card"><div class="dash-label">RESULTADO ESTIMADO · ${esc(selectedMonth)}</div><div class="big-result">${euro(result)}</div><select id="monthPicker" class="month-select">${monthOptionsHtml}</select><div class="metrics"><div class="metric"><span>💵 Ventas</span><strong>${euro(sales)}</strong></div><div class="metric"><span>🛒 Compras</span><strong>${euro(purchases)}</strong></div><div class="metric"><span>👥 Personal</span><strong>${euro(personal)}</strong></div><div class="metric"><span>🧾 Otros gastos</span><strong>${euro(other)}</strong></div></div></div><div class="section-title">Últimas facturas</div>${recent.length?`<div class="list">${recent.map(x=>invoiceRow(x,false)).join('')}</div>`:'<div class="empty">Todavía no hay facturas.</div>'}`}
function invoiceMonthOptions(){const months=[...new Set(invoices.map(x=>(x.invoice_date||'').slice(0,7)).filter(Boolean))].sort().reverse();return `<option value="all" ${invoiceFilterMonth==='all'?'selected':''}>Todos los meses</option>`+months.map(m=>`<option value="${esc(m)}" ${invoiceFilterMonth===m?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
function invoicesView(){const edit=editingInvoiceId?invoices.find(x=>x.id===editingInvoiceId):null;const date=edit?.invoice_date||localDate(),supplier=edit?.supplier||'',number=edit?.invoice_number||'',base=edit?.base_amount??'',vat=edit?.vat_amount??'',total=edit?.total??'';return `<h2>Facturas</h2><div class="card">${edit?`<p class="edit-note">✏️ Editando ${esc(edit.supplier)} · ${esc(edit.invoice_number||'Sin nº')}. Si no eliges otro archivo, se conserva el actual.</p>`:''}<div class="form-grid"><div class="field"><label>Fecha</label><input id="invDate" type="date" value="${esc(date)}"></div><div class="field"><label>Proveedor</label><input id="invSupplier" autocomplete="off" value="${esc(supplier)}"></div><div class="field"><label>Nº factura</label><input id="invNumber" autocomplete="off" value="${esc(number)}"></div><div class="field"><label>Base imponible</label><input id="invBase" type="number" inputmode="decimal" step="0.01" value="${esc(base)}"></div><div class="field"><label>IVA</label><input id="invVat" type="number" inputmode="decimal" step="0.01" value="${esc(vat)}"></div><div class="field"><label>Total</label><input id="invTotal" type="number" inputmode="decimal" step="0.01" value="${esc(total)}"></div><div class="file-wrap"><label style="display:block;color:#99968f;font-size:.9rem;margin-bottom:7px">${edit?'Cambiar foto o PDF (opcional)':'Foto o PDF'}</label><div class="file-box"><input id="invFile" type="file" accept="image/*,application/pdf" capture="environment"></div><button id="aiRead" class="ai-btn" style="display:none">✨ Leer factura con IA</button><p id="aiHint" class="hint" style="display:none">La IA rellena los campos para que los revises. Nada se guarda hasta que pulses ${edit?'Guardar cambios':'Guardar factura'}.</p></div></div><button id="saveInvoice" class="primary wide">${edit?'Guardar cambios':'Guardar factura'}</button>${edit?'<button id="cancelInvoiceEdit" class="secondary wide">Cancelar edición</button>':''}</div>${invoices.length?`<div class="card invoice-tools"><div class="invoice-tools-grid"><input id="invoiceSearch" type="search" placeholder="Buscar proveedor o nº factura" value="${esc(invoiceFilterText)}"><select id="invoiceMonth">${invoiceMonthOptions()}</select></div><div class="invoice-summary"><span id="invoiceCount"></span><strong id="invoiceVisibleTotal"></strong></div></div><div class="list invoice-list">${invoices.map(x=>invoiceRow(x,true)).join('')}</div><div id="invoiceNoResults" class="empty" style="display:none">No hay facturas con ese filtro.</div>`:'<div class="empty">Sin facturas.</div>'}`}
function productsView(){return `<h2>Productos</h2><div class="card"><div class="form-grid"><div class="field"><label>Producto</label><input id="prodName"></div><div class="field"><label>Proveedor</label><input id="prodSupplier"></div><div class="field"><label>Fecha</label><input id="prodDate" type="date" value="${localDate()}"></div><div class="field"><label>Precio</label><input id="prodPrice" type="number" inputmode="decimal" step="0.001"></div><div class="field"><label>Unidad</label><select id="prodUnit"><option>kg</option><option>unidad</option><option>caja</option><option>bandeja</option><option>litro</option></select></div></div><button id="saveProduct" class="primary wide">Guardar precio</button></div>${products.length?`<div class="list">${products.map(x=>`<div class="row"><div><div class="row-title">${esc(x.name)}</div><div class="row-meta">${esc(x.supplier)} · ${fmtDate(x.price_date)}</div></div><div class="row-amount">${euro(x.price)} / ${esc(x.unit)}</div></div>`).join('')}</div>`:'<div class="empty">Sin precios.</div>'}`}
function providersView(){const map={};for(const x of invoices){const k=(x.supplier||'Sin proveedor').trim();if(!map[k])map[k]={name:k,total:0,count:0,last:''};map[k].total+=Number(x.total||0);map[k].count++;if(!map[k].last||x.invoice_date>map[k].last)map[k].last=x.invoice_date}const rows=Object.values(map).sort((a,b)=>b.total-a.total);return `<h2>Proveedores</h2>${rows.length?`<div class="list">${rows.map(p=>`<div class="row"><div><div class="row-title">${esc(p.name)}</div><div class="row-meta">${p.count} factura${p.count===1?'':'s'} · última ${fmtDate(p.last)}</div></div><div class="row-amount">${euro(p.total)}</div></div>`).join('')}</div>`:'<div class="empty">Sin proveedores.</div>'}`}
function moreView(){return `<h2>Cuenta</h2><div class="card"><h3 class="account-title sync-pill"><span>☁</span> Nube activa <span class="dot"></span></h3><p class="account-email">${esc(session?.user?.email||'')}</p><button id="logout" class="secondary">Cerrar sesión</button></div><div class="section-title">Ingresos / gastos</div><div class="card"><div class="form-grid"><div class="field"><label>Tipo</label><select id="movType"><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option><option value="personal">Personal</option></select></div><div class="field"><label>Fecha</label><input id="movDate" type="date" value="${localDate()}"></div><div class="field"><label>Concepto</label><input id="movConcept"></div><div class="field"><label>Importe</label><input id="movAmount" type="number" inputmode="decimal" step="0.01"></div></div><button id="saveMove" class="primary wide">Guardar movimiento</button></div>${moves.length?`<div class="list">${moves.map(x=>`<div class="row"><div><div class="row-title">${esc(x.concept)}</div><div class="row-meta">${fmtDate(x.move_date)} · ${x.move_type==='ingreso'?'Ingreso':x.move_type==='personal'?'Personal':'Gasto'}</div></div><div class="row-amount">${x.move_type==='ingreso'?'+':'-'}${euro(x.amount)}</div></div>`).join('')}</div>`:''}`}
async function checkCloud(){try{setBusy(true);const u=await api('/auth/v1/user');if(u?.id){toast('Nube conectada correctamente');route='more';renderApp();scrollTo(0,0);return}throw new Error('Sesión no válida')}catch(e){toast('Problema con la nube: '+e.message)}finally{setBusy(false)}}
function renderApp(){const root=document.getElementById('root');root.innerHTML=`<div class="app"><header class="topbar"><div><div class="eyebrow">LA PIZARRITA DE JUANLU</div><div class="brand">Control del negocio</div></div><button id="cloudBtn" class="cloud-btn">☁ Nube</button></header><main id="main">${route==='dashboard'?dashboard():route==='invoices'?invoicesView():route==='products'?productsView():route==='providers'?providersView():moreView()}</main><nav class="bottom-nav"><button class="nav ${route==='dashboard'?'active':''}" data-route="dashboard">Inicio</button><button class="nav ${route==='invoices'?'active':''}" data-route="invoices">Facturas</button><button class="nav ${route==='products'?'active':''}" data-route="products">Productos</button><button class="nav ${route==='providers'?'active':''}" data-route="providers">Proveedores</button><button class="nav ${route==='more'?'active':''}" data-route="more">Más</button></nav></div>`;bind()}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{if(b.dataset.route!=='invoices'){editingInvoiceId=null;editingFilePath=null}route=b.dataset.route;renderApp();scrollTo(0,0)});document.getElementById('cloudBtn').onclick=checkCloud;document.getElementById('monthPicker')?.addEventListener('change',e=>{selectedMonth=e.target.value;renderApp()});document.getElementById('logout')?.addEventListener('click',signOut);const f=document.getElementById('invFile');if(f)f.onchange=()=>{const show=!!f.files?.[0];document.getElementById('aiRead').style.display=show?'block':'none';document.getElementById('aiHint').style.display=show?'block':'none'};document.getElementById('aiRead')?.addEventListener('click',readInvoiceAI);document.querySelectorAll('.invoice-file').forEach(b=>b.addEventListener('click',()=>openInvoiceFile(b.dataset.filePath)));document.querySelectorAll('.invoice-edit').forEach(b=>b.addEventListener('click',()=>startEditInvoice(b.dataset.invoiceId)));document.querySelectorAll('.invoice-delete').forEach(b=>b.addEventListener('click',()=>deleteInvoice(b.dataset.invoiceId)));document.getElementById('cancelInvoiceEdit')?.addEventListener('click',cancelInvoiceEdit);document.getElementById('saveInvoice')?.addEventListener('click',saveInvoice);document.getElementById('saveProduct')?.addEventListener('click',saveProduct);document.getElementById('saveMove')?.addEventListener('click',saveMove);document.getElementById('invoiceSearch')?.addEventListener('input',e=>{invoiceFilterText=e.target.value;applyInvoiceFilters()});document.getElementById('invoiceMonth')?.addEventListener('change',e=>{invoiceFilterMonth=e.target.value;applyInvoiceFilters()});applyInvoiceFilters()}
function applyInvoiceFilters(){const rows=[...document.querySelectorAll('.invoice-list .invoice-row')];if(!rows.length)return;const q=invoiceFilterText.trim().toLowerCase();let count=0,total=0;for(const row of rows){const text=(row.dataset.search||'').toLowerCase(),month=row.dataset.month||'';const show=(!q||text.includes(q))&&(invoiceFilterMonth==='all'||month===invoiceFilterMonth);row.style.display=show?'flex':'none';if(show){count++;total+=Number(row.dataset.total||0)}}const countEl=document.getElementById('invoiceCount'),totalEl=document.getElementById('invoiceVisibleTotal'),emptyEl=document.getElementById('invoiceNoResults');if(countEl)countEl.textContent=`${count} factura${count===1?'':'s'}`;if(totalEl)totalEl.textContent=`Total: ${euro(total)}`;if(emptyEl)emptyEl.style.display=count?'none':'block'}
function startEditInvoice(id){const x=invoices.find(i=>i.id===id);if(!x)return;editingInvoiceId=id;editingFilePath=x.file_path||null;route='invoices';renderApp();scrollTo(0,0);toast('Factura lista para editar')}
function cancelInvoiceEdit(){editingInvoiceId=null;editingFilePath=null;renderApp();scrollTo(0,0)}
async function openInvoiceFile(path){if(!path){toast('Esta factura no tiene archivo.');return}const win=window.open('about:blank','_blank');try{setBusy(true);const enc=path.split('/').map(encodeURIComponent).join('/');const getFile=()=>fetch(`${SB_URL}/storage/v1/object/authenticated/invoice-files/${enc}`,{headers:{apikey:SB_KEY,Authorization:`Bearer ${session.access_token}`}});let res=await getFile();if(res.status===401&&await refreshSession())res=await getFile();if(!res.ok)throw new Error('No se pudo abrir el archivo guardado.');const blob=await res.blob();const url=URL.createObjectURL(blob);if(win)win.location.href=url;else window.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){if(win)win.close();toast(e.message||'No se pudo abrir el archivo.')}finally{setBusy(false)}}
async function deleteStorageFile(path){if(!path)return;const remove=()=>fetch(`${SB_URL}/storage/v1/object/invoice-files`,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({prefixes:[path]})});let res=await remove();if(res.status===401&&await refreshSession())res=await remove();if(!res.ok)throw new Error('No se pudo borrar el archivo de la nube')}
async function uploadInvoiceFile(file){if(!file)return null;const safe=(file.name||'factura').replace(/[^a-zA-Z0-9._-]+/g,'_');const path=`${session.user.id}/${Date.now()}-${safe}`;const res=await fetch(`${SB_URL}/storage/v1/object/invoice-files/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${session.access_token}`,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!res.ok){let d={};try{d=await res.json()}catch{}throw new Error(d.message||d.error||'No se pudo subir el archivo')}return path}
async function saveInvoice(){const date=v('invDate'),supplier=v('invSupplier'),number=v('invNumber'),base=num('invBase'),vat=num('invVat'),total=num('invTotal');if(!date||!supplier||!total){toast('Pon al menos fecha, proveedor y total.');return}let newPath=null;try{setBusy(true);const file=document.getElementById('invFile')?.files?.[0];let file_path=editingFilePath||null;if(file){newPath=await uploadInvoiceFile(file);file_path=newPath}const body={user_id:session.user.id,invoice_date:date,supplier,invoice_number:number||null,base_amount:base||null,vat_amount:vat||null,total,file_path,extraction_status:null,extraction_json:null};if(editingInvoiceId){const oldPath=editingFilePath;await api(`/rest/v1/invoices?id=eq.${encodeURIComponent(editingInvoiceId)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body});if(newPath&&oldPath&&oldPath!==newPath)await deleteStorageFile(oldPath).catch(()=>{});editingInvoiceId=null;editingFilePath=null;toast('Factura actualizada en la nube')}else{await api('/rest/v1/invoices',{method:'POST',headers:{Prefer:'return=minimal'},body});toast('Factura guardada en la nube')}selectedMonth=date.slice(0,7);await loadData()}catch(e){if(newPath&&newPath!==editingFilePath)await deleteStorageFile(newPath).catch(()=>{});const msg=e?.message||'';if(/duplicate key|unique constraint|23505/i.test(msg))toast('Esa factura ya está guardada.');else toast('No se pudo guardar: '+msg)}finally{setBusy(false)}}
async function deleteInvoice(id){const x=invoices.find(i=>i.id===id);if(!x)return;if(!confirm(`¿Borrar la factura de ${x.supplier} por ${euro(x.total)}?`))return;try{setBusy(true);await api(`/rest/v1/invoice_items?invoice_id=eq.${encodeURIComponent(id)}`,{method:'DELETE'}).catch(()=>{});await api(`/rest/v1/invoices?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});if(x.file_path)await deleteStorageFile(x.file_path).catch(()=>{});if(editingInvoiceId===id){editingInvoiceId=null;editingFilePath=null}toast('Factura borrada');await loadData()}catch(e){toast('No se pudo borrar: '+e.message)}finally{setBusy(false)}}
async function saveProduct(){const name=v('prodName'),supplier=v('prodSupplier'),date=v('prodDate'),price=num('prodPrice'),unit=v('prodUnit');if(!name||!supplier||!date||!price){toast('Completa producto, proveedor, fecha y precio.');return}try{setBusy(true);await api('/rest/v1/products',{method:'POST',headers:{Prefer:'return=minimal'},body:{user_id:session.user.id,name,supplier,price_date:date,price,unit,net_cost:null}});toast('Precio guardado en la nube');await loadData()}catch(e){toast('No se pudo guardar: '+e.message)}finally{setBusy(false)}}
async function saveMove(){const move_type=v('movType'),date=v('movDate'),concept=v('movConcept'),amount=num('movAmount');if(!date||!concept||!amount){toast('Completa fecha, concepto e importe.');return}try{setBusy(true);await api('/rest/v1/moves',{method:'POST',headers:{Prefer:'return=minimal'},body:{user_id:session.user.id,move_type,move_date:date,concept,amount,notes:null}});selectedMonth=date.slice(0,7);toast('Movimiento guardado en la nube');await loadData()}catch(e){toast('No se pudo guardar: '+e.message)}finally{setBusy(false)}}
function v(id){return document.getElementById(id)?.value?.trim()||''}function num(id){const s=v(id).replace(',','.');return Number(s)||0}
function fill(id,val){if(val===null||val===undefined||val==='')return;const el=document.getElementById(id);if(el)el.value=val}
async function imageDataUrl(file){if(!file.type.startsWith('image/'))return await fileToDataUrl(file);try{const bmp=await createImageBitmap(file);const max=1600,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.82)}catch{return await fileToDataUrl(file)}}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function readInvoiceAI(){const file=document.getElementById('invFile')?.files?.[0];if(!file)return;try{setBusy(true);const dataUrl=file.type==='application/pdf'?await fileToDataUrl(file):await imageDataUrl(file);if(dataUrl.length>5_500_000)throw new Error('El archivo es demasiado grande para leerlo con IA.');const res=await fetch('/api/invoice-ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({dataUrl,name:file.name,type:file.type})});const data=await res.json();if(!res.ok){if(data.code==='AI_NOT_CONFIGURED')throw new Error('La IA todavía no está configurada en Vercel.');throw new Error(data.error||'No se pudo leer la factura')}const x=data.invoice||{};fill('invDate',x.date);fill('invSupplier',x.supplier);fill('invNumber',x.invoice_number);fill('invBase',x.base_amount);fill('invVat',x.vat_amount);fill('invTotal',x.total);toast('Factura leída. Revisa los datos antes de guardar.')}catch(e){toast(e.message)}finally{setBusy(false)}}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login-shell"><div class="login-card"><div class="eyebrow">LA PIZARRITA DE JUANLU</div><h1>Acceso a La Pizarrita</h1><p>Entra para usar tu nube privada.</p><div class="field"><label>Correo</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div><div class="login-actions"><button id="loginBtn" class="primary">Entrar</button><button id="signupBtn" class="secondary">Crear mi acceso</button></div><div id="loginStatus" class="status"></div></div></div>`;document.getElementById('loginBtn').onclick=async()=>{const e=v('loginEmail'),p=v('loginPass');if(!e||!p)return;status('Entrando…');try{await signIn(e,p);await api('/auth/v1/user').then(u=>{session.user=u;saveSession(session)});renderApp();await loadData()}catch(err){status(err.message)}};document.getElementById('signupBtn').onclick=async()=>{const e=v('loginEmail'),p=v('loginPass');if(!e||!p)return;status('Creando acceso…');try{const d=await signUp(e,p);if(d.access_token){session=d;renderApp();await loadData()}else status('Revisa tu correo para confirmar el acceso.')}catch(err){status(err.message)}}}
function status(t){const e=document.getElementById('loginStatus');if(e)e.textContent=t}
(async()=>{document.getElementById('root').innerHTML='<div class="login-shell"><div class="login-card"><h1>Cargando…</h1></div></div>';if(await restoreSession()){renderApp();await loadData()}else renderLogin()})();
</script>
</body>
