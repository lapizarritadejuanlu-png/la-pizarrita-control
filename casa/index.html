<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa y Familia">
<link rel="manifest" href="/casa/manifest.json">
<link rel="icon" href="/casa/icon.svg" type="image/svg+xml">
<title>Casa y Familia</title>
<style>
:root{--bg:#061326;--panel:#0b2748;--panel2:#091e38;--text:#f7fbff;--muted:#9db3ca;--line:#284b6c;--mint:#62e1c7;--violet:#a78bfa;--bad:#ff9ca5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#123d6b 0,#081d38 28%,#061326 62%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:24px 20px 18px;background:#061326ee;border-bottom:1px solid #173855;backdrop-filter:blur(16px)}.top small{display:block;color:var(--mint);font-weight:900;letter-spacing:.16em}.top h1{font-family:Georgia,"Times New Roman",serif;margin:4px 0 0;font-size:1.65rem}.top>span{border:1px solid var(--mint);border-radius:999px;padding:10px 14px;color:var(--mint)}main{max-width:760px;margin:0 auto;padding:20px 18px 110px}h2{font-size:1.25rem;margin:8px 0 14px}.hero,.card,.grid article{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:20px}.hero{padding:22px;margin-bottom:14px}.hero small{color:#b7c9da}.hero div{font-size:2.45rem;font-weight:950;color:var(--mint);margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.grid article{padding:15px;color:var(--muted)}.grid b{display:block;color:var(--text);font-size:1.1rem;margin-top:6px}.card{padding:16px;margin-bottom:18px}.expense-card{padding:2px 0 13px;border-bottom:1px solid #20415f}.expense-card:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0}.row small{display:block;color:var(--muted);font-size:.8rem;margin:4px 0 7px}.row button,.card>button{border:1px solid #365b79;background:#0a213c;color:#e8f4ff;border-radius:10px;padding:7px 9px;margin-right:5px}.row button:last-child{color:#ffb0b6}.form{display:grid;gap:14px}.form label{color:#b6c6d5;font-size:.88rem}.form em{font-weight:400;color:var(--muted)}input,select{display:block;width:100%;margin-top:7px;background:#071a31;border:1px solid #315472;color:var(--text);border-radius:14px;padding:13px 14px;min-height:50px;outline:none}input:focus,select:focus{border-color:var(--mint)}.save,.ai{width:100%;border-radius:14px;padding:14px 16px;font-weight:950;border:0}.save{background:linear-gradient(135deg,var(--mint),#80ead7);color:#04261f}.ai{background:#211f51!important;border:1px solid #7065be!important;color:#eee8ff!important}.ai:disabled{opacity:.55}.hint{color:var(--muted);font-size:.82rem;line-height:1.4;margin:2px 0 0}.detected{border:1px solid #315573;border-radius:16px;background:#081d36;padding:13px}.detected>b{display:block;color:var(--mint);margin-bottom:6px}.products{margin:0 0 4px;background:#071b32;border:1px solid #254764;border-radius:14px;overflow:hidden}.products summary{cursor:pointer;padding:11px 12px;color:#bcefe5;font-weight:850}.product-list,.detected{font-size:.88rem}.product-line{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-top:1px solid #1c3b57}.detected .product-line{padding-left:0;padding-right:0}.product-line b{display:block}.product-line small{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}.product-line strong{white-space:nowrap}nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#07162bf2;border-top:1px solid #24435f;padding:10px 6px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}nav button{border:0;background:transparent;color:#9bb1c7;font-weight:800;font-size:.76rem}.plus{width:48px;height:48px;border-radius:50%;margin:-26px auto 0;background:var(--mint)!important;color:#053127!important;font-size:1.7rem!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login .card{width:min(420px,100%)}#toast{position:fixed;z-index:99;left:50%;bottom:105px;transform:translateX(-50%);max-width:90%;padding:11px 15px;border-radius:999px;background:#102e4e;border:1px solid #3b6080;color:white;opacity:0;pointer-events:none;transition:.2s;text-align:center}#toast.show{opacity:1}@media(max-width:390px){.top h1{font-size:1.45rem}.hero div{font-size:2.05rem}}
</style>
</head>
<body><div id="root"></div><div id="toast"></div><script src="/casa/app-v3.js?v=1"></script><script src="/casa/products-open.js?v=1"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/casa/sw.js',{scope:'/casa/'}).catch(()=>{}));}</script></body>
</html>
