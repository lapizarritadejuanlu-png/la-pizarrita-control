<html lang="es">
<head>

<title>Casa y Familia</title>
<style>
:root{--bg:#061326;--bg2:#081d38;--panel:#0c2747;--panel2:#0a213d;--text:#f7fbff;--muted:#9bb0ca;--line:#244768;--mint:#62e1c7;--mint2:#42cbb6;--violet:#a78bfa;--blue:#65b8ff;--pink:#f08ccd;--yellow:#ffd166;--good:#6ee7a8;--bad:#ff8f9a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#123c68 0,#081d38 28%,#061326 62%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:98px}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:24px 24px 20px;background:#061326ee;backdrop-filter:blur(16px);border-bottom:1px solid #153552}.eyebrow{font-size:.72rem;letter-spacing:.16em;font-weight:900;color:var(--mint)}.brand{font-family:Georgia,"Times New Roman",serif;font-size:1.72rem;font-weight:800;margin-top:4px}.cloud{border:1px solid var(--mint);border-radius:999px;color:var(--mint);padding:10px 15px;font-weight:800;background:#071a33}.content{padding:22px 24px 34px}.hero{background:linear-gradient(145deg,#12355fdd,#0a2443ee);border:1px solid #2d5278;border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:0 18px 45px #0004}.hero-label{color:#b7c7da;font-size:.9rem}.hero-total{font-size:2.55rem;font-weight:950;color:var(--mint);margin:7px 0 4px;letter-spacing:-.04em}.period-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 20px}.period-card{background:linear-gradient(145deg,#0e2b4e,#091f39);border:1px solid #254969;border-radius:18px;padding:16px}.period-card span{display:block;color:var(--muted);font-size:.82rem}.period-card strong{display:block;margin-top:6px;font-size:1.25rem}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font-size:1.15rem;margin:0}.link-btn{border:0;background:transparent;color:var(--mint);font-weight:800}.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cat-card{border:1px solid #234867;border-radius:18px;background:linear-gradient(145deg,#0d2a4b,#091f39);padding:15px}.cat-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#153e62;font-size:1.15rem}.cat-card strong{display:block;font-size:1.05rem;margin-top:10px}.cat-card span{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}.card{background:linear-gradient(145deg,#0d2949,#091e37);border:1px solid #244866;border-radius:20px;padding:18px;margin-bottom:16px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #1d3d5b}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-title{font-weight:850}.row-meta{color:var(--muted);font-size:.8rem;margin-top:4px}.row-amount{font-weight:900;white-space:nowrap}.row-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tiny{border:1px solid #315474;background:#0a2039;color:#dcecff;border-radius:10px;padding:6px 9px;font-size:.73rem;font-weight:800}.tiny.danger{border-color:#784654;color:#ffb2ba}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;color:#b0bfd0;font-size:.86rem;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #315372;background:#071a31;color:var(--text);border-radius:14px;padding:13px 14px;min-height:50px;outline:none}textarea{min-height:88px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--mint)}input[type=file]{padding:10px;min-height:auto}.primary{width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,var(--mint),#78e7d1);color:#04251e;padding:14px 18px;font-weight:950;font-size:1.02rem}.secondary{border:1px solid #315574;border-radius:14px;background:#0a213d;color:var(--text);padding:12px 14px;font-weight:850}.ai{width:100%;margin-top:12px;border:1px solid #6d61b8;border-radius:14px;background:#211f51;color:#e9e2ff;padding:13px;font-weight:900}.hint{color:var(--muted);font-size:.82rem;line-height:1.4;margin-top:7px}.toolbar{display:grid;grid-template-columns:1.2fr .8fr;gap:10px;margin-bottom:14px}.empty{color:var(--muted);padding:20px 0}.fixed-rule{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-flex;align-items:center;border:1px solid #315675;border-radius:999px;padding:5px 9px;color:#a8bdd4;font-size:.72rem;margin-top:5px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;background:#07162beF;border-top:1px solid #24425f;padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.nav{border:0;background:transparent;color:#8fa6c0;font-weight:800;font-size:.73rem;padding:7px 2px}.nav .ico{display:block;font-size:1.15rem;margin-bottom:3px}.nav.active{color:var(--mint)}.addnav .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:-24px auto 3px;background:linear-gradient(135deg,var(--mint),#7de8d4);color:#042b22;font-size:1.65rem;box-shadow:0 8px 22px #0007}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(420px,100%);background:linear-gradient(145deg,#0e2d51,#081d36);border:1px solid #2b506f;border-radius:24px;padding:26px}.login h1{font-family:Georgia,"Times New Roman",serif;margin:4px 0 8px;font-size:2rem}.login p{color:var(--muted);margin:0 0 20px}.login .field{margin-bottom:12px}.status{color:#d7c7ff;font-size:.84rem;margin-top:12px}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);z-index:80;background:#102c4a;color:#fff;border:1px solid #345a7b;border-radius:999px;padding:10px 15px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px #0008;max-width:90%;text-align:center}.toast.show{opacity:1}.loading{opacity:.62;pointer-events:none}.month-input{width:auto;min-width:160px}.account{word-break:break-all;color:#cbd8e6}.danger-wide{width:100%;border:1px solid #784553;color:#ffb0ba;background:#2a1722;border-radius:14px;padding:13px;font-weight:850;margin-top:10px}
@media(max-width:520px){.content,.topbar{padding-left:18px;padding-right:18px}.hero-total{font-size:2.25rem}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{grid-template-columns:1fr}.brand{font-size:1.5rem}.cloud{font-size:.86rem;padding:9px 12px}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const SB_URL='https://mpzemodwiuxqemvfaqvs.supabase.co';
const SB_KEY='sb_publishable_5b0LE9t_UFaHQwsYZ7BvKQ_k_tAmbVc';
const PROJECT_REF='mpzemodwiuxqemvfaqvs';
const SESSION_KEY='casa-familia-session-v1';
const CATEGORIES=['Casa','Supermercado','Coche','Familia','Ocio','Restaurantes','Viajes','Salud/Farmacia','Ropa','Suscripciones','Seguros','Gastos personales','Otros'];
const CAT_ICONS={'Casa':'🏠','Supermercado':'🛒','Coche':'🚗','Familia':'👨‍👩‍👧','Ocio':'🎬','Restaurantes':'🍽️','Viajes':'🧳','Salud/Farmacia':'💊','Ropa':'👕','Suscripciones':'▶️','Seguros':'🛡️','Gastos personales':'👤','Otros':'•••'};
let session=null,expenses=[],rules=[],route='home',busy=false,selectedMonth=localDate().slice(0,7),editingId=null;
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function esc(s=''){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function euro(n){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0)}
function fmtDate(s){if(!s)return '';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function monthLabel(s){return new Intl.DateTimeFormat('es-ES',{month:'long',year:'numeric'}).format(new Date(s+'-02T12:00:00'))}
function toast(m){const x=document.getElementById('toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
function setBusy(v){busy=v;document.querySelector('.app')?.classList.toggle('loading',v)}
async function api(path,{method='GET',body,headers={}}={}){const h={apikey:SB_KEY,...headers};if(session?.access_token)h.Authorization=`Bearer ${session.access_token}`;if(body!==undefined&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(SB_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});if(r.status===401&&session?.refresh_token&&!path.startsWith('/auth/v1/token')){if(await refreshSession())return api(path,{method,body,headers})}const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error_description||d?.error||`Error ${r.status}`);return d}
function saveSession(s){session=s;localStorage.setItem(SESSION_KEY,JSON.stringify(s))}
function candidateSessions(){const keys=[SESSION_KEY,`sb-${PROJECT_REF}-auth-token`,'pizarrita-cloud-session-v3'];const out=[];for(const k of keys){try{const v=JSON.parse(localStorage.getItem(k)||'null');for(const x of [v,v?.currentSession,v?.session,v?.data?.session,v?.data])if(x?.access_token&&x?.refresh_token)out.push(x)}catch{}}return out}
async function validateSession(s){try{session=s;const u=await api('/auth/v1/user');saveSession({...s,user:u});return true}catch{return false}}
async function refreshSession(){try{const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;saveSession(await r.json());return true}catch{return false}}
async function restoreSession(){for(const s of candidateSessions()){if(await validateSession(s))return true;session=s;if(await refreshSession()&&await validateSession(session))return true}session=null;return false}
async function signIn(email,password){const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'No se ha podido entrar');saveSession(d)}
async function signOut(){try{await api('/auth/v1/logout',{method:'POST'})}catch{}localStorage.removeItem(SESSION_KEY);session=null;renderLogin()}
async function loadData(){try{setBusy(true);const [e,r]=await Promise.all([api('/rest/v1/home_expenses?select=*&order=expense_date.desc,created_at.desc'),api('/rest/v1/home_expense_rules?select=*&order=created_at.desc')]);expenses=e||[];rules=r||[];await ensureRecurring();render()}catch(e){toast('No se pudo sincronizar: '+e.message)}finally{setBusy(false)}}
function dueDateForMonth(rule,ym){const [y,m]=ym.split('-').map(Number),day=Math.min(Number(rule.start_date.slice(8,10)),new Date(y,m,0).getDate());return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
async function ensureRecurring(){const today=localDate(),ym=today.slice(0,7),year=today.slice(0,4);for(const r of rules.filter(x=>x.active)){let due=null;if(r.cadence==='monthly')due=dueDateForMonth(r,ym);else if(r.cadence==='annual'&&r.start_date.slice(5,7)===today.slice(5,7))due=`${year}-${r.start_date.slice(5)}`;if(!due||due>today||due<r.start_date)continue;if(expenses.some(x=>x.recurring_rule_id===r.id&&x.expense_date===due))continue;try{const rows=await api('/rest/v1/home_expenses?select=*',{method:'POST',headers:{Prefer:'return=representation'},body:{user_id:session.user.id,expense_date:due,concept:r.concept,category:r.category,amount:Number(r.amount),paid_by:r.paid_by||null,payment_method:r.payment_method||null,recurring_rule_id:r.id}});if(rows?.[0])expenses.push(rows[0])}catch(e){if(!String(e.message).toLowerCase().includes('duplicate'))console.warn(e)}}}
function sums(){const now=new Date(),today=localDate(),monday=new Date(now);monday.setDate(now.getDate()-((now.getDay()+6)%7));const mon=localDate(monday);const year=today.slice(0,4),month=today.slice(0,7);const sum=fn=>expenses.filter(fn).reduce((a,x)=>a+Number(x.amount||0),0);return{day:sum(x=>x.expense_date===today),week:sum(x=>x.expense_date>=mon&&x.expense_date<=today),month:sum(x=>x.expense_date?.startsWith(month)),year:sum(x=>x.expense_date?.startsWith(year))}}
function nav(){return `<nav class="bottom"><button class="nav ${route==='home'?'active':''}" data-route="home"><span class="ico">⌂</span>Inicio</button><button class="nav ${route==='expenses'?'active':''}" data-route="expenses"><span class="ico">▤</span>Gastos</button><button class="nav addnav ${route==='add'?'active':''}" data-route="add"><span class="ico">＋</span>Añadir</button><button class="nav ${route==='fixed'?'active':''}" data-route="fixed"><span class="ico">↻</span>Fijos</button><button class="nav ${route==='more'?'active':''}" data-route="more"><span class="ico">•••</span>Más</button></nav>`}
function shell(body){return `<div class="app"><header class="topbar"><div><div class="eyebrow">CASA & FAMILIA</div><div class="brand">Control del hogar</div></div><div class="cloud">☁ Nube</div></header><main class="content">${body}</main>${nav()}</div>`}
function home(){const s=sums(),monthRows=expenses.filter(x=>x.expense_date?.startsWith(localDate().slice(0,7))),by={};for(const x of monthRows)by[x.category]=(by[x.category]||0)+Number(x.amount||0);const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,6);const recent=expenses.slice(0,6);return shell(`<div class="hero"><div class="hero-label">Total gastado este mes</div><div class="hero-total">${euro(s.month)}</div><div class="hint">Actualizado con todos los gastos guardados</div></div><div class="period-grid"><div class="period-card"><span>Hoy</span><strong>${euro(s.day)}</strong></div><div class="period-card"><span>Esta semana</span><strong>${euro(s.week)}</strong></div><div class="period-card"><span>Este mes</span><strong>${euro(s.month)}</strong></div><div class="period-card"><span>Este año</span><strong>${euro(s.year)}</strong></div></div><div class="section-head"><h2>Por categorías</h2></div>${cats.length?`<div class="category-grid">${cats.map(([c,v])=>`<div class="cat-card"><div class="cat-icon">${CAT_ICONS[c]||'•'}</div><strong>${esc(c)}</strong><span>${euro(v)}</span></div>`).join('')}</div>`:`<div class="card empty">Todavía no hay gastos este mes.</div>`}<div class="section-head"><h2>Últimos gastos</h2><button class="link-btn" data-route="expenses">Ver todos</button></div><div class="card">${recent.length?recent.map(expenseRow).join(''):'<div class="empty">No hay gastos registrados.</div>'}</div>`)}
function expenseRow(x){return `<div class="row"><div class="row-main"><div class="row-title">${esc(x.concept)}</div><div class="row-meta">${esc(x.category)} · ${fmtDate(x.expense_date)}${x.paid_by?` · ${esc(x.paid_by)}`:''}</div><div class="row-actions"><button class="tiny edit-expense" data-id="${x.id}">Editar</button>${x.file_path?`<button class="tiny view-file" data-path="${esc(x.file_path)}">📎 Ticket</button>`:''}<button class="tiny danger delete-expense" data-id="${x.id}">Borrar</button></div></div><div class="row-amount">${euro(x.amount)}</div></div>`}
function expensesPage(){const months=[...new Set(expenses.map(x=>x.expense_date?.slice(0,7)).filter(Boolean))].sort().reverse();return shell(`<div class="section-head"><h2>Gastos</h2><input id="monthFilter" class="month-input" type="month" value="${esc(selectedMonth)}"></div><div class="toolbar"><input id="expenseSearch" placeholder="Buscar gasto…"><select id="categoryFilter"><option value="">Todas las categorías</option>${CATEGORIES.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="card" id="expenseList"></div>`)}
function renderExpenseList(){const box=document.getElementById('expenseList');if(!box)return;const q=(document.getElementById('expenseSearch')?.value||'').toLowerCase(),cat=document.getElementById('categoryFilter')?.value||'';const rows=expenses.filter(x=>(!selectedMonth||x.expense_date?.startsWith(selectedMonth))&&(!cat||x.category===cat)&&(!q||`${x.concept} ${x.category} ${x.notes||''}`.toLowerCase().includes(q)));box.innerHTML=rows.length?`<div class="hint" style="margin-bottom:10px">${rows.length} gasto${rows.length===1?'':'s'} · ${euro(rows.reduce((a,x)=>a+Number(x.amount||0),0))}</div>${rows.map(expenseRow).join('')}`:'<div class="empty">No hay gastos con estos filtros.</div>'}
function addPage(){const x=editingId?expenses.find(e=>e.id===editingId):null;return shell(`<div class="section-head"><h2>${x?'Editar gasto':'Añadir gasto'}</h2></div><div class="card"><div class="form-grid"><div class="field"><label>Fecha</label><input id="eDate" type="date" value="${esc(x?.expense_date||localDate())}"></div><div class="field"><label>Importe</label><input id="eAmount" inputmode="decimal" placeholder="0,00" value="${x?String(x.amount).replace('.',','):''}"></div><div class="field full"><label>Concepto</label><input id="eConcept" placeholder="Ej. Mercadona, recibo de luz…" value="${esc(x?.concept||'')}"></div><div class="field"><label>Categoría</label><select id="eCategory"><option value="">Selecciona</option>${CATEGORIES.map(c=>`<option ${x?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Quién lo ha pagado</label><select id="ePaid"><option value="">Sin indicar</option>${['Yo','Mi pareja','Familia/Otro'].map(v=>`<option ${x?.paid_by===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Método de pago</label><select id="eMethod"><option value="">Sin indicar</option>${['Efectivo','Tarjeta','Transferencia','Domiciliado','Bizum','Otro'].map(v=>`<option ${x?.payment_method===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Notas</label><textarea id="eNotes" placeholder="Opcional">${esc(x?.notes||'')}</textarea></div>${x?'':`<div class="field full"><label>Foto del ticket (opcional)</label><input id="eFile" type="file" accept="image/*,application/pdf"><button type="button" id="aiExpense" class="ai">✨ Leer ticket con IA</button><div class="hint">La IA puede rellenar fecha, concepto, categoría e importe. Revisa siempre antes de guardar.</div></div>`}</div><button id="saveExpense" class="primary" style="margin-top:16px">${x?'Guardar cambios':'Guardar gasto'}</button>${x?'<button id="cancelEdit" class="secondary" style="width:100%;margin-top:10px">Cancelar edición</button>':''}</div>`)}
function fixedPage(){return shell(`<div class="section-head"><h2>Gastos fijos</h2></div><div class="card"><div class="hint" style="margin-top:0;margin-bottom:14px">Para recibos que se repiten. Se añadirán automáticamente cuando llegue su fecha.</div><div class="form-grid"><div class="field full"><label>Concepto</label><input id="rConcept" placeholder="Ej. Internet, comunidad…"></div><div class="field"><label>Importe</label><input id="rAmount" inputmode="decimal" placeholder="0,00"></div><div class="field"><label>Categoría</label><select id="rCategory"><option value="">Selecciona</option>${CATEGORIES.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Empieza</label><input id="rDate" type="date" value="${localDate()}"></div><div class="field"><label>Frecuencia</label><select id="rCadence"><option value="monthly">Mensual</option><option value="annual">Anual</option></select></div></div><button id="saveRule" class="primary" style="margin-top:16px">Añadir gasto fijo</button></div><div class="card">${rules.length?rules.map(r=>`<div class="row"><div class="row-main"><div class="row-title">${esc(r.concept)}</div><div class="row-meta">${esc(r.category)} · ${euro(r.amount)}</div><div class="pill">${r.cadence==='monthly'?'Mensual':'Anual'} · ${r.active?'Activo':'Pausado'}</div><div class="row-actions"><button class="tiny toggle-rule" data-id="${r.id}" data-active="${r.active}">${r.active?'Pausar':'Reactivar'}</button><button class="tiny danger delete-rule" data-id="${r.id}">Borrar</button></div></div><div>${CAT_ICONS[r.category]||'↻'}</div></div>`).join(''):'<div class="empty">No hay gastos fijos todavía.</div>'}</div>`)}
function morePage(){return shell(`<div class="section-head"><h2>Más</h2></div><div class="card"><div class="hint">Cuenta</div><div class="account">${esc(session?.user?.email||'')}</div></div><div class="card"><button id="exportCsv" class="secondary" style="width:100%">↓ Exportar gastos a CSV</button><button id="logout" class="danger-wide">Cerrar sesión</button></div><div class="hint">Casa & Familia · versión 1.0</div>`)}
function render(){const root=document.getElementById('root');root.innerHTML=route==='home'?home():route==='expenses'?expensesPage():route==='add'?addPage():route==='fixed'?fixedPage():morePage();bind();if(route==='expenses')renderExpenseList()}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;if(route!=='add')editingId=null;render()});document.getElementById('monthFilter')?.addEventListener('change',e=>{selectedMonth=e.target.value;renderExpenseList()});document.getElementById('expenseSearch')?.addEventListener('input',renderExpenseList);document.getElementById('categoryFilter')?.addEventListener('change',renderExpenseList);document.getElementById('saveExpense')?.addEventListener('click',saveExpense);document.getElementById('aiExpense')?.addEventListener('click',readExpenseAI);document.getElementById('cancelEdit')?.addEventListener('click',()=>{editingId=null;route='expenses';render()});document.getElementById('saveRule')?.addEventListener('click',saveRule);document.querySelectorAll('.edit-expense').forEach(b=>b.onclick=()=>{editingId=b.dataset.id;route='add';render()});document.querySelectorAll('.delete-expense').forEach(b=>b.onclick=()=>deleteExpense(b.dataset.id));document.querySelectorAll('.view-file').forEach(b=>b.onclick=()=>viewFile(b.dataset.path));document.querySelectorAll('.toggle-rule').forEach(b=>b.onclick=()=>toggleRule(b.dataset.id,b.dataset.active==='true'));document.querySelectorAll('.delete-rule').forEach(b=>b.onclick=()=>deleteRule(b.dataset.id));document.getElementById('exportCsv')?.addEventListener('click',exportCsv);document.getElementById('logout')?.addEventListener('click',signOut)}
function numberVal(id){const s=(document.getElementById(id)?.value||'').trim().replace(/\./g,'').replace(',','.');const n=Number(s);return Number.isFinite(n)?n:null}
async function uploadHomeFile(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${session.user.id}/home/${localDate().slice(0,7)}/${crypto.randomUUID()}.${ext||'jpg'}`;const r=await fetch(`${SB_URL}/storage/v1/object/invoice-files/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${session.access_token}`,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!r.ok)throw new Error('No se pudo guardar la foto');return path}
async function saveExpense(){const concept=document.getElementById('eConcept').value.trim(),category=document.getElementById('eCategory').value,amount=numberVal('eAmount'),date=document.getElementById('eDate').value;if(!concept||!category||amount===null||amount<0||!date)return toast('Completa concepto, categoría, fecha e importe');try{setBusy(true);const body={expense_date:date,concept,category,amount,paid_by:document.getElementById('ePaid').value||null,payment_method:document.getElementById('eMethod').value||null,notes:document.getElementById('eNotes').value.trim()||null,updated_at:new Date().toISOString()};if(editingId){const rows=await api(`/rest/v1/home_expenses?id=eq.${editingId}&select=*`,{method:'PATCH',headers:{Prefer:'return=representation'},body});expenses=expenses.map(x=>x.id===editingId?rows[0]:x);editingId=null;toast('Gasto actualizado')}else{const file=document.getElementById('eFile')?.files?.[0];if(file)body.file_path=await uploadHomeFile(file);body.user_id=session.user.id;const rows=await api('/rest/v1/home_expenses?select=*',{method:'POST',headers:{Prefer:'return=representation'},body});expenses.unshift(rows[0]);toast('Gasto guardado')}route='home';render()}catch(e){toast(e.message)}finally{setBusy(false)}}
async function fileToDataUrl(file){return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}
async function readExpenseAI(){const f=document.getElementById('eFile')?.files?.[0];if(!f)return toast('Selecciona primero una foto o PDF');try{setBusy(true);const dataUrl=await fileToDataUrl(f);const r=await fetch('/api/home-expense-ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({dataUrl,name:f.name,type:f.type})});const text=await r.text();let d=null;try{d=JSON.parse(text)}catch{}if(!r.ok||!d)throw new Error(d?.error||'No se pudo leer el ticket');const x=d.expense||{};if(x.date)document.getElementById('eDate').value=x.date;if(x.concept)document.getElementById('eConcept').value=x.concept;if(x.category&&CATEGORIES.includes(x.category))document.getElementById('eCategory').value=x.category;if(x.amount!=null)document.getElementById('eAmount').value=String(x.amount).replace('.',',');toast('Ticket leído. Revisa los datos')}catch(e){toast(e.message)}finally{setBusy(false)}}
async function deleteExpense(id){if(!confirm('¿Borrar este gasto?'))return;try{const x=expenses.find(e=>e.id===id);await api(`/rest/v1/home_expenses?id=eq.${id}`,{method:'DELETE'});expenses=expenses.filter(e=>e.id!==id);if(x?.file_path)fetch(`${SB_URL}/storage/v1/object/invoice-files/${x.file_path}`,{method:'DELETE',headers:{apikey:SB_KEY,Authorization:`Bearer ${session.access_token}`}}).catch(()=>{});render();toast('Gasto borrado')}catch(e){toast(e.message)}}
async function viewFile(path){try{const r=await fetch(`${SB_URL}/storage/v1/object/sign/invoice-files/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:120})});const d=await r.json();if(!r.ok)throw new Error('No se pudo abrir');window.open(`${SB_URL}/storage/v1${d.signedURL}`,'_blank')}catch(e){toast(e.message)}}
async function saveRule(){const concept=document.getElementById('rConcept').value.trim(),category=document.getElementById('rCategory').value,amount=numberVal('rAmount'),start=document.getElementById('rDate').value,cadence=document.getElementById('rCadence').value;if(!concept||!category||amount===null||amount<0||!start)return toast('Completa los datos del gasto fijo');try{const rows=await api('/rest/v1/home_expense_rules?select=*',{method:'POST',headers:{Prefer:'return=representation'},body:{user_id:session.user.id,concept,category,amount,start_date:start,cadence,active:true}});rules.unshift(rows[0]);await ensureRecurring();render();toast('Gasto fijo añadido')}catch(e){toast(e.message)}}
async function toggleRule(id,active){try{const rows=await api(`/rest/v1/home_expense_rules?id=eq.${id}&select=*`,{method:'PATCH',headers:{Prefer:'return=representation'},body:{active:!active,updated_at:new Date().toISOString()}});rules=rules.map(r=>r.id===id?rows[0]:r);render()}catch(e){toast(e.message)}}
async function deleteRule(id){if(!confirm('¿Borrar este gasto fijo? Los gastos ya creados se conservarán.'))return;try{await api(`/rest/v1/home_expense_rules?id=eq.${id}`,{method:'DELETE'});rules=rules.filter(r=>r.id!==id);render();toast('Gasto fijo borrado')}catch(e){toast(e.message)}}
function exportCsv(){const head=['Fecha','Concepto','Categoria','Importe','Pagado por','Metodo','Notas'];const rows=expenses.map(x=>[x.expense_date,x.concept,x.category,Number(x.amount).toFixed(2),x.paid_by||'',x.payment_method||'',x.notes||'']);const q=v=>`"${String(v).replace(/"/g,'""')}"`;const csv='\ufeff'+[head,...rows].map(r=>r.map(q).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`gastos-casa-${localDate()}.csv`;a.click();URL.revokeObjectURL(a.href)}
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login-shell"><div class="login"><div class="eyebrow">CASA & FAMILIA</div><h1>Control del hogar</h1><p>Entra con tu acceso. Los datos de casa están separados de los del negocio.</p><div class="field"><label>Correo</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary">Entrar</button><div id="loginStatus" class="status"></div></div></div>`;document.getElementById('loginBtn').onclick=async()=>{const s=document.getElementById('loginStatus');try{s.textContent='Entrando…';await signIn(document.getElementById('loginEmail').value.trim(),document.getElementById('loginPass').value);await api('/auth/v1/user').then(u=>{session.user=u;saveSession(session)});await loadData()}catch(e){s.textContent=e.message}}}
(async()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('/casa/sw.js').catch(()=>{});if(await restoreSession())await loadData();else renderLogin()})();
</script>
</body></html>
