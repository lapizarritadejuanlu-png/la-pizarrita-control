# one-time trigger
name: One-time wire invoice items

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-wire-invoice-items.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          old="let session=null,route='dashboard',selectedMonth=localDate().slice(0,7),invoices=[],products=[],moves=[],busy=false,editingInvoiceId=null,editingFilePath=null,invoiceFilterText='',invoiceFilterMonth='all';"
          new="let session=null,route='dashboard',selectedMonth=localDate().slice(0,7),invoices=[],products=[],moves=[],busy=false,editingInvoiceId=null,editingFilePath=null,invoiceFilterText='',invoiceFilterMonth='all',pendingInvoiceItems=[],aiItemsLoaded=false,saveDetectedItems=true;"
          if s.count(old) != 1:
              raise SystemExit(f'State marker count {s.count(old)}')
          s=s.replace(old,new,1)

          css=".invoice-summary strong{font-size:1.05rem;color:var(--text)}"
          css2=css+".ai-items-preview{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.ai-items-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.ai-items-title{font-weight:900}.ai-items-list{display:flex;flex-direction:column;gap:7px}.ai-item{display:flex;justify-content:space-between;gap:12px;padding:9px 10px;border:1px solid #30322d;border-radius:11px;background:#11120f}.ai-item-name{font-size:.87rem;font-weight:800}.ai-item-meta{font-size:.76rem;color:var(--muted);margin-top:3px}.ai-item-total{font-size:.84rem;font-weight:900;white-space:nowrap}.ai-items-off{opacity:.45}.mini-btn{border:1px solid #484a42;background:#171816;color:var(--text);border-radius:10px;padding:7px 9px;font-size:.75rem;font-weight:800}"
          if s.count(css) != 1:
              raise SystemExit(f'CSS marker count {s.count(css)}')
          s=s.replace(css,css2,1)

          marker='</p></div></div><button id="saveInvoice"'
          repl='</p><div id="aiItemsPreview" class="ai-items-preview" style="display:none"></div></div></div><button id="saveInvoice"'
          if s.count(marker) != 1:
              raise SystemExit(f'Preview marker count {s.count(marker)}')
          s=s.replace(marker,repl,1)

          old_prod="${esc(x.supplier)} · ${fmtDate(x.price_date)}</div></div><div class=\"row-amount\">${euro(x.price)} / ${esc(x.unit)}</div></div>"
          new_prod="${esc(x.supplier)} · ${fmtDate(x.price_date)}${x.source_invoice_id?' · 📄 factura':''}</div></div><div class=\"row-amount\">${euro(x.price)} / ${esc(x.unit)}</div></div>"
          if s.count(old_prod) != 1:
              raise SystemExit(f'Product marker count {s.count(old_prod)}')
          s=s.replace(old_prod,new_prod,1)

          bind_new=r'''function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{if(b.dataset.route!=='invoices'){editingInvoiceId=null;editingFilePath=null;pendingInvoiceItems=[];aiItemsLoaded=false;saveDetectedItems=true}route=b.dataset.route;renderApp();scrollTo(0,0)});document.getElementById('cloudBtn').onclick=checkCloud;document.getElementById('monthPicker')?.addEventListener('change',e=>{selectedMonth=e.target.value;renderApp()});document.getElementById('logout')?.addEventListener('click',signOut);const f=document.getElementById('invFile');if(f)f.onchange=()=>{pendingInvoiceItems=[];aiItemsLoaded=false;saveDetectedItems=true;renderAiItems();const show=!!f.files?.[0];document.getElementById('aiRead').style.display=show?'block':'none';document.getElementById('aiHint').style.display=show?'block':'none'};document.getElementById('aiRead')?.addEventListener('click',readInvoiceAI);document.querySelectorAll('.invoice-file').forEach(b=>b.addEventListener('click',()=>openInvoiceFile(b.dataset.filePath)));document.querySelectorAll('.invoice-edit').forEach(b=>b.addEventListener('click',()=>startEditInvoice(b.dataset.invoiceId)));document.querySelectorAll('.invoice-delete').forEach(b=>b.addEventListener('click',()=>deleteInvoice(b.dataset.invoiceId)));document.getElementById('cancelInvoiceEdit')?.addEventListener('click',cancelInvoiceEdit);document.getElementById('saveInvoice')?.addEventListener('click',saveInvoice);document.getElementById('saveProduct')?.addEventListener('click',saveProduct);document.getElementById('saveMove')?.addEventListener('click',saveMove);document.getElementById('invoiceSearch')?.addEventListener('input',e=>{invoiceFilterText=e.target.value;applyInvoiceFilters()});document.getElementById('invoiceMonth')?.addEventListener('change',e=>{invoiceFilterMonth=e.target.value;applyInvoiceFilters()});applyInvoiceFilters();renderAiItems()}
'''
          s,n=re.subn(r"function bind\(\)\{.*?\}\nfunction applyInvoiceFilters",bind_new+'function applyInvoiceFilters',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Bind replacement count {n}')

          helper=r'''function cleanAiItems(raw){const maybe=v=>{if(v===null||v===undefined||v==='')return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null};return (Array.isArray(raw)?raw:[]).slice(0,100).map(x=>({description:String(x?.description||'').trim().slice(0,300),quantity:maybe(x?.quantity),unit:x?.unit?String(x.unit).trim().slice(0,40):null,unit_price:maybe(x?.unit_price),line_total:maybe(x?.line_total)})).filter(x=>x.description)}
function renderAiItems(){const el=document.getElementById('aiItemsPreview');if(!el)return;if(!aiItemsLoaded){el.style.display='none';el.innerHTML='';return}el.style.display='block';if(!pendingInvoiceItems.length){el.innerHTML='<div class="ai-items-title">Productos detectados: 0</div><div class="hint">No se han identificado líneas de producto con suficiente claridad.</div>';return}const rows=pendingInvoiceItems.map(x=>{const qty=x.quantity!==null?`${x.quantity}${x.unit?' '+esc(x.unit):''}`:'';const price=x.unit_price!==null?`${euro(x.unit_price)} / ${esc(x.unit||'unidad')}`:'';const meta=[qty,price].filter(Boolean).join(' · ');return `<div class="ai-item"><div><div class="ai-item-name">${esc(x.description)}</div>${meta?`<div class="ai-item-meta">${meta}</div>`:''}</div><div class="ai-item-total">${x.line_total!==null?euro(x.line_total):''}</div></div>`}).join('');el.classList.toggle('ai-items-off',!saveDetectedItems);el.innerHTML=`<div class="ai-items-head"><div class="ai-items-title">🧾 ${pendingInvoiceItems.length} producto${pendingInvoiceItems.length===1?'':'s'} detectado${pendingInvoiceItems.length===1?'':'s'}</div><button type="button" id="toggleAiItems" class="mini-btn">${saveDetectedItems?'No guardar productos':'Guardar productos'}</button></div><div class="ai-items-list">${rows}</div><div class="hint">Revísalos. Se guardarán con la factura y actualizarán Productos.</div>`;document.getElementById('toggleAiItems')?.addEventListener('click',()=>{saveDetectedItems=!saveDetectedItems;renderAiItems()})}
async function syncInvoiceProducts(invoiceId,supplier,date,replace=false){if(!aiItemsLoaded||!saveDetectedItems)return {items:0,products:0};if(replace){await api(`/rest/v1/invoice_items?invoice_id=eq.${encodeURIComponent(invoiceId)}`,{method:'DELETE'});await api(`/rest/v1/products?source_invoice_id=eq.${encodeURIComponent(invoiceId)}`,{method:'DELETE'})}const itemRows=pendingInvoiceItems.map(x=>({user_id:session.user.id,invoice_id:invoiceId,description:x.description,quantity:x.quantity,unit:x.unit,unit_price:x.unit_price,line_total:x.line_total}));if(itemRows.length)await api('/rest/v1/invoice_items',{method:'POST',headers:{Prefer:'return=minimal'},body:itemRows});const productRows=pendingInvoiceItems.filter(x=>x.unit_price!==null&&Number.isFinite(Number(x.unit_price))&&Number(x.unit_price)>0).map(x=>({user_id:session.user.id,name:x.description,supplier,price_date:date,price:Number(x.unit_price),unit:x.unit||'sin especificar',net_cost:null,source_invoice_id:invoiceId}));if(productRows.length)await api('/rest/v1/products',{method:'POST',headers:{Prefer:'return=minimal'},body:productRows});return {items:itemRows.length,products:productRows.length}}
'''
          if s.count('function startEditInvoice(id)') != 1:
              raise SystemExit('startEdit marker not found once')
          s=s.replace('function startEditInvoice(id)',helper+'function startEditInvoice(id)',1)

          old_edit="function startEditInvoice(id){const x=invoices.find(i=>i.id===id);if(!x)return;editingInvoiceId=id;editingFilePath=x.file_path||null;route='invoices';renderApp();scrollTo(0,0);toast('Factura lista para editar')}"
          new_edit="function startEditInvoice(id){const x=invoices.find(i=>i.id===id);if(!x)return;editingInvoiceId=id;editingFilePath=x.file_path||null;pendingInvoiceItems=[];aiItemsLoaded=false;saveDetectedItems=true;route='invoices';renderApp();scrollTo(0,0);toast('Factura lista para editar')}"
          if s.count(old_edit) != 1:
              raise SystemExit(f'Edit marker count {s.count(old_edit)}')
          s=s.replace(old_edit,new_edit,1)

          old_cancel="function cancelInvoiceEdit(){editingInvoiceId=null;editingFilePath=null;renderApp();scrollTo(0,0)}"
          new_cancel="function cancelInvoiceEdit(){editingInvoiceId=null;editingFilePath=null;pendingInvoiceItems=[];aiItemsLoaded=false;saveDetectedItems=true;renderApp();scrollTo(0,0)}"
          if s.count(old_cancel) != 1:
              raise SystemExit(f'Cancel marker count {s.count(old_cancel)}')
          s=s.replace(old_cancel,new_cancel,1)

          save_new=r'''async function saveInvoice(){const date=v('invDate'),supplier=v('invSupplier'),number=v('invNumber'),base=num('invBase'),vat=num('invVat'),total=num('invTotal');if(!date||!supplier||!total){toast('Pon al menos fecha, proveedor y total.');return}let newPath=null;try{setBusy(true);const file=document.getElementById('invFile')?.files?.[0];let file_path=editingFilePath||null;if(file){newPath=await uploadInvoiceFile(file);file_path=newPath}const body={user_id:session.user.id,invoice_date:date,supplier,invoice_number:number||null,base_amount:base||null,vat_amount:vat||null,total,file_path};if(aiItemsLoaded){body.extraction_status='reviewed';body.extraction_json={items:pendingInvoiceItems}}else if(!editingInvoiceId){body.extraction_status=null;body.extraction_json=null}let invoiceId=editingInvoiceId;const wasEdit=!!editingInvoiceId;if(wasEdit){const oldPath=editingFilePath;await api(`/rest/v1/invoices?id=eq.${encodeURIComponent(invoiceId)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body});if(newPath&&oldPath&&oldPath!==newPath)await deleteStorageFile(oldPath).catch(()=>{})}else{const created=await api('/rest/v1/invoices',{method:'POST',headers:{Prefer:'return=representation'},body});invoiceId=Array.isArray(created)?created[0]?.id:created?.id;if(!invoiceId)throw new Error('No se pudo confirmar la factura guardada')}let syncResult=null;const wantedSync=aiItemsLoaded&&saveDetectedItems;if(wantedSync){try{syncResult=await syncInvoiceProducts(invoiceId,supplier,date,wasEdit)}catch(e){console.error('Product sync error',e?.message||'unknown')}}editingInvoiceId=null;editingFilePath=null;pendingInvoiceItems=[];aiItemsLoaded=false;saveDetectedItems=true;selectedMonth=date.slice(0,7);if(syncResult)toast(`${wasEdit?'Factura actualizada':'Factura guardada'} · ${syncResult.products} precios a Productos`);else if(wantedSync)toast(`${wasEdit?'Factura actualizada':'Factura guardada'}; revisa Productos`);else toast(wasEdit?'Factura actualizada en la nube':'Factura guardada en la nube');await loadData()}catch(e){if(newPath&&newPath!==editingFilePath)await deleteStorageFile(newPath).catch(()=>{});const msg=e?.message||'';if(/duplicate key|unique constraint|23505/i.test(msg))toast('Esa factura ya está guardada.');else toast('No se pudo guardar: '+msg)}finally{setBusy(false)}}
'''
          s,n=re.subn(r"async function saveInvoice\(\)\{.*?\}\nasync function deleteInvoice",save_new+'async function deleteInvoice',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Save replacement count {n}')

          read_new=r'''async function readInvoiceAI(){const file=document.getElementById('invFile')?.files?.[0];if(!file)return;try{setBusy(true);const dataUrl=file.type==='application/pdf'?await fileToDataUrl(file):await imageDataUrl(file);if(dataUrl.length>5_500_000)throw new Error('El archivo es demasiado grande para leerlo con IA.');const res=await fetch('/api/invoice-ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({dataUrl,name:file.name,type:file.type})});const data=await res.json();if(!res.ok){if(data.code==='AI_NOT_CONFIGURED')throw new Error('La lectura automática no está disponible ahora mismo.');throw new Error(data.error||'No se pudo leer la factura')}const x=data.invoice||{};fill('invDate',x.date);fill('invSupplier',x.supplier);fill('invNumber',x.invoice_number);fill('invBase',x.base_amount);fill('invVat',x.vat_amount);fill('invTotal',x.total);pendingInvoiceItems=cleanAiItems(x.items);aiItemsLoaded=true;saveDetectedItems=true;renderAiItems();toast(pendingInvoiceItems.length?`Factura leída · ${pendingInvoiceItems.length} productos detectados`:'Factura leída. Revisa los datos antes de guardar.')}catch(e){toast(e.message)}finally{setBusy(false)}}
'''
          s,n=re.subn(r"async function readInvoiceAI\(\)\{.*?\}\nfunction renderLogin",read_new+'function renderLogin',s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit(f'Read replacement count {n}')

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Wire AI invoice items into products"
          git push
