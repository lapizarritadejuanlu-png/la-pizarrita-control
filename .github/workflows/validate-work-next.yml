name: Validate work-next

on:
  push:
    branches: [work-next]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Check scripts referenced by index
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const refs=[...html.matchAll(/\/([A-Za-z0-9._-]+\.js)(?=[?\\"'])/g)].map(m=>m[1]);
          if(!refs.length) throw new Error('No JavaScript references found in index.html');
          const missing=refs.filter(f=>!fs.existsSync(f));
          const duplicates=refs.filter((f,i)=>refs.indexOf(f)!==i);
          if(missing.length) throw new Error(`Missing scripts: ${[...new Set(missing)].join(', ')}`);
          if(duplicates.length) throw new Error(`Duplicate scripts: ${[...new Set(duplicates)].join(', ')}`);
          console.log(`Validated ${refs.length} referenced scripts: ${refs.join(', ')}`);
          NODE
